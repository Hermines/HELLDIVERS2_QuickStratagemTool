<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./tokens.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            cursor: crosshair;
            /* The dim stays black in both themes: it is a functional capture
               veil over the screen, not a themed surface. */
            background: rgba(0, 0, 0, 0.32);
            font-family: var(--font-ui);
            -webkit-font-smoothing: antialiased;
        }
        #hint {
            position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
            padding: 10px 16px;
            border: 1px solid var(--stroke-control);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-md);
            background: var(--status-bg);
            color: var(--text-primary);
            font-size: 14px; font-weight: 600;
            box-shadow: var(--shadow-flyout);
        }
        #selection {
            position: fixed; display: none;
            border: 2px solid var(--accent);
            background: var(--accent-soft);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.28);
        }
        #size {
            position: absolute; right: 0; bottom: -28px;
            padding: 3px 8px; background: var(--accent); color: var(--text-on-accent);
            border-radius: var(--radius-sm); font-size: 12px; font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="hint"></div>
    <div id="selection"><div id="size"></div></div>
    <script src="./bridge.js"></script>
    <script>
        const selection = document.getElementById('selection');
        const sizeLabel = document.getElementById('size');
        let dragging = false;
        let startX = 0;
        let startY = 0;

        const hintByLanguage = {
            zh: '拖动鼠标框选 OCR 识别区域，按 Esc 取消',
            en: 'Drag to select the OCR area. Press Esc to cancel.'
        };

        // The selector window is created on demand, so pull the persisted
        // language and theme at load time to match the main window.
        function applyUiPreferences(settings) {
            const language = settings && settings.language === 'en' ? 'en' : 'zh';
            document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
            document.getElementById('hint').textContent = hintByLanguage[language];
            document.documentElement.dataset.theme = settings && settings.theme === 'light' ? 'light' : 'dark';
        }
        document.getElementById('hint').textContent = hintByLanguage.zh;
        if (window.electronAPI && window.electronAPI.loadData) {
            window.electronAPI.loadData('settings.json')
                .then(applyUiPreferences)
                .catch(() => {});
        }

        function updateSelection(x, y) {
            const left = Math.min(startX, x);
            const top = Math.min(startY, y);
            const width = Math.abs(x - startX);
            const height = Math.abs(y - startY);
            selection.style.display = 'block';
            selection.style.left = `${left}px`;
            selection.style.top = `${top}px`;
            selection.style.width = `${width}px`;
            selection.style.height = `${height}px`;
            const scale = window.devicePixelRatio || 1;
            sizeLabel.textContent = `${Math.round(width * scale)} x ${Math.round(height * scale)} px`;
        }

        window.addEventListener('mousedown', (event) => {
            if (event.button !== 0) return;
            dragging = true;
            startX = event.clientX;
            startY = event.clientY;
            updateSelection(startX, startY);
        });

        window.addEventListener('mousemove', (event) => {
            if (!dragging) return;
            updateSelection(event.clientX, event.clientY);
        });

        window.addEventListener('mouseup', (event) => {
            if (!dragging) return;
            dragging = false;
            const width = Math.abs(event.clientX - startX);
            const height = Math.abs(event.clientY - startY);
            if (width < 10 || height < 10) {
                selection.style.display = 'none';
                return;
            }
            window.electronAPI.sendOcrRegionSelected({
                startX,
                startY,
                endX: event.clientX,
                endY: event.clientY
            });
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                window.electronAPI.cancelOcrRegionSelect();
            }
        });
    </script>
</body>
</html>
