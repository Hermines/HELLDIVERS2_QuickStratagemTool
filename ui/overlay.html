<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./tokens.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Impact', sans-serif; letter-spacing: 1px; }
        body { background: transparent; color: var(--text-primary); overflow: hidden; transition: opacity 0.3s ease; }


        /* The in-game list stays dark for game readability; the drag bar is a
           configuration surface and uses the Fluent dark palette instead. The
           window never opts into the light theme, so the shared tokens below
           always resolve to their dark values. */
        #drag-bar {
            -webkit-app-region: drag;
            background: var(--status-bg);
            border: 1px solid var(--stroke-control);
            border-left: 3px solid var(--accent);
            margin: 8px 8px 12px 8px;
            border-radius: 6px;
            padding: 6px 8px 6px 10px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--shadow-flyout);
        }

        .drag-info {
            display: flex; align-items: center; gap: 8px;
            color: var(--text-secondary);
            font-family: var(--font-ui);
            font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
        }


        .lock-btn {
            -webkit-app-region: no-drag;
            background: var(--fill-control);
            color: var(--text-secondary);
            border: 1px solid var(--stroke-strong);
            border-radius: 4px;
            cursor: pointer;
            width: 26px; height: 26px;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.16s var(--motion-decelerate), color 0.16s var(--motion-decelerate), border-color 0.16s var(--motion-decelerate);
        }

        .lock-btn:hover {
            background: var(--fill-control-hover);
            color: var(--text-primary);
            border-color: var(--stroke-strong);
        }

        .lock-btn:active {
            background: var(--fill-control-pressed);
            color: var(--text-secondary);
            box-shadow: var(--shadow-btn-pressed);
        }

        #list-container { display: flex; flex-direction: column; gap: 6px; padding: 0 8px 8px 8px; padding-right: 20px; }

        /* In-game readability rules here: fills stay dark, and state is
           carried by Fluent token colors instead of surface swaps that
           would wash out over arbitrary game footage. Selection reuses
           the main-window card idiom — accent border plus an accent-soft
           layer over the dark base — with a NavigationView-style left
           indicator bar standing in for the old slide-out translation.
           Execution flashes the shared accent-glow pulse ring; the inset
           shadow layers the tint above the dark base without hard-coding
           the accent value. */
        .stratagem-item {
            display: flex; align-items: center; gap: 12px;
            position: relative;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--stroke-strong);
            padding: 6px 10px;
            transition: transform 0.2s var(--motion-decelerate), background-color 0.2s var(--motion-decelerate), border-color 0.2s var(--motion-decelerate), box-shadow 0.2s var(--motion-decelerate);
            border-radius: var(--radius-md);
            width: 100%;
            box-shadow: var(--shadow-card);
        }

        .stratagem-item.selected-box {
            border-color: var(--accent);
            transform: translateX(10px);
            box-shadow: inset 0 0 0 999px var(--accent-soft), 0 0 0 1px var(--accent), -6px 0px 0px var(--accent), var(--shadow-card);
        }

        .stratagem-item.active-glow {
            border-color: var(--accent) !important;
            background-color: var(--accent);
            transform: translateX(10px) scale(1.05);
            box-shadow: 0 0 0 1px var(--accent), -6px 0px 0px var(--accent);
        }

        /* The long-period glow ring lives on its own layer so the fill,
           scale, and border share one 0.2s transition clock: lit blue while
           the item is scaled up, cooling back to the dark base as it shrinks. */
        .stratagem-item.active-glow::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            animation: overlay-flash-ring var(--flash-duration, 600ms) var(--motion-decelerate);
        }

        /* The hotkey text rides the fill's 0.2s transition clock: black on
           accent while lit, back to the Fluent blue as the base cools. */
        .stratagem-item.active-glow .hotkey-text { color: var(--text-on-accent); }

        @keyframes overlay-flash-ring {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 12px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        .icon { width: 40px; height: 40px; object-fit: contain; border: 1px solid var(--stroke-control); border-radius: var(--radius-sm); background: rgba(0, 0, 0, 0.8); padding: 2px; }
        

        .hotkey-text {
            font-family: var(--font-ui);
            font-size: 20px; font-weight: 600; letter-spacing: 0.5px;
            color: #1A86D8;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
        }


        .hotkey-icon {
            display: inline-flex; justify-content: center; align-items: center;
            background: linear-gradient(180deg, #e6e6e6 0%, #a3a3a3 100%);
            border: 1px solid #333; border-radius: 6px;
            color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px; font-weight: 800; letter-spacing: 0; padding: 4px 10px;
            box-shadow: 0 4px 0px #555, 0 5px 5px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.8);
            transform: translateY(-2px);
            min-width: 32px;
        }

        body.locked #drag-bar { display: none; }
        body.locked .stratagem-item { border-color: transparent; }
        body.locked .stratagem-item.selected-box { border-color: var(--accent); }
    </style>
</head>
<body>
    <div id="drag-bar" data-tauri-drag-region="deep">
        <div class="drag-info">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="5 9 2 12 5 15"></polyline>
                <polyline points="9 5 12 2 15 5"></polyline>
                <polyline points="19 9 22 12 19 15"></polyline>
                <polyline points="9 19 12 22 15 19"></polyline>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="12" y1="2" x2="12" y2="22"></line>
            </svg>
        </div>
        
        <button class="lock-btn" data-tauri-drag-region="false" onclick="lockOverlay()" title="Lock Overlay">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </button>
    </div>
    
    <div id="list-container"></div>

    <script src="./bridge.js"></script>
    <script>
        let currentStyle = 'text';
        let selectedOverlayItem = null;
        const EMPTY_IMAGE_SOURCE = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

        function safeImageSource(value) {
            const source = typeof value === 'string' ? value.trim() : '';
            if (!source) return EMPTY_IMAGE_SOURCE;
            if (/^data:image\/(?:png|jpe?g|gif|webp|svg\+xml);base64,[a-z0-9+/=]+$/i.test(source)) return source;
            if (!/^[a-z][a-z0-9+.-]*:/i.test(source) && !source.startsWith('//') && !source.includes('\\')) return source;
            return EMPTY_IMAGE_SOURCE;
        }

        async function lockOverlay() {
            try {
                await window.electronAPI.lockOverlay();
            } catch (error) {
                console.error('Failed to lock overlay:', error);
            }
        }
        window.electronAPI.onOverlayLocked(() => document.body.classList.add('locked'));
        window.electronAPI.onOverlayUnlocked(() => document.body.classList.remove('locked'));

        function applyOverlaySettings(settings) {
            if (!settings || typeof settings !== 'object') return;
            document.body.style.opacity = settings.opacity / 100;
            currentStyle = settings.style;
        }
        window.electronAPI.onOverlaySettings(applyOverlaySettings);

        function formatKeyName(key) {
            if(typeof key !== 'string' || !key) return '';
            return key.split('+').map(part => part.replace(/Key|Digit|Numpad/g, '')
                          .replace('ControlLeft', 'LCtrl')
                          .replace('ControlRight', 'RCtrl')
                          .replace('ShiftLeft', 'LShift')
                          .replace('ShiftRight', 'RShift')
                          .replace('AltLeft', 'LAlt')
                          .replace('AltRight', 'RAlt')
                          .replace('MouseMiddle', 'M-Mid')
                          .replace('MouseSide1', 'M-S1')
                          .replace('MouseSide2', 'M-S2')
                          .replace('WheelUp', 'W-Up')
                          .replace('WheelDown', 'W-Down')).join(' + ');
        }

        function renderOverlay(loadout) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            selectedOverlayItem = null;
            if (!Array.isArray(loadout)) return;
            const validItems = loadout.filter(item => item && item.strat); 
            if(validItems.length === 0) return;

            validItems.forEach((item, index) => {
                const strat = item.strat;
                const div = document.createElement('div');
                div.className = 'stratagem-item';
                div.id = `strat-idx-${index}`; 
                
                const image = document.createElement('img');
                image.className = 'icon';
                image.src = safeImageSource(strat.icon);
                div.appendChild(image);
                if(item.hotkey) {
                    const hotkey = document.createElement('div');
                    hotkey.className = currentStyle === 'svg' ? 'hotkey-icon' : 'hotkey-text';
                    const displayName = formatKeyName(item.hotkey);
                    hotkey.textContent = currentStyle === 'svg' ? displayName : `[ ${displayName} ]`;
                    div.appendChild(hotkey);
                }
                container.appendChild(div);
            });
        }
        window.electronAPI.onRenderOverlay(renderOverlay);

        function selectOverlayItem(index) {
            if (selectedOverlayItem) selectedOverlayItem.classList.remove('selected-box');
            selectedOverlayItem = document.getElementById(`strat-idx-${index}`);
            if (selectedOverlayItem) selectedOverlayItem.classList.add('selected-box');
        }
        window.electronAPI.onSelectionChanged(selectOverlayItem);

        // One timer per item. Re-arming must cancel the stale removal timer,
        // and a re-trigger while still lit must NOT cycle the class: the
        // remove/reflow/add trick makes the fill, scale, and border blink
        // toward dark for a frame before re-lighting.
        const flashTimers = new Map();
        // Hold the lit state this long after a flash expires so a rapid
        // re-trigger re-arms while still lit; only a lapse longer than the
        // cool-down transition lets the item visibly darken.
        const FLASH_REARM_GRACE_MS = 240;

        window.electronAPI.onHighlightItem((data) => {
            const { index } = data || {};
            const el = document.getElementById(`strat-idx-${index}`);
            if (!el) return;
            const duration = Number(data.duration);
            const flashMs = Number.isFinite(duration) && duration > 0 ? Math.min(Math.round(duration), 10000) : 600;
            const pending = flashTimers.get(index);
            if (pending) clearTimeout(pending);
            if (!el.classList.contains('active-glow')) {
                el.style.setProperty('--flash-duration', `${flashMs}ms`);
                el.classList.add('active-glow');
            }
            flashTimers.set(index, setTimeout(() => {
                flashTimers.set(index, setTimeout(() => {
                    el.classList.remove('active-glow');
                    flashTimers.delete(index);
                }, FLASH_REARM_GRACE_MS));
            }, flashMs));
        });

        // Overlay is created only when first shown. Read the latest state so
        // events emitted before the new WebView finished loading are not lost.
        window.electronAPI.getOverlaySnapshot().then((snapshot) => {
            if (!snapshot) return;
            applyOverlaySettings(snapshot.settings);
            renderOverlay(snapshot.data);
            selectOverlayItem(snapshot.selection);
            document.body.classList.toggle('locked', !!snapshot.locked);
        }).catch(() => {});
    </script>
</body>
</html>
