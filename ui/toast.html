<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./tokens.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden; background: transparent;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-ui);
            -webkit-font-smoothing: antialiased;
        }
        #toast {
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 20px);
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--status-bg);
            color: var(--text-primary);
            border: 1px solid var(--stroke-control);
            border-left: 3px solid var(--accent);
            box-shadow: var(--shadow-flyout);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            white-space: normal;
            overflow: auto;
            overflow-wrap: anywhere;
            word-break: break-word;
            opacity: 0;
            transform: translateY(22px) scale(0.98);
            transition: opacity 180ms ease, transform 180ms ease;
        }
        #toast.show { opacity: 1; transform: translateY(0) scale(1); }
        #toast.error {
            background: var(--danger-solid-bg);
            color: var(--danger-text);
            border-left-color: var(--danger-text);
        }
    </style>
</head>
<body>
    <div id="toast"></div>
    <script src="./bridge.js"></script>
    <script>
        const toast = document.getElementById('toast');
        let hideTimer = null;
        let fadeTimer = null;
        let activeGeneration = 0;

        // Each toast window is recreated on demand, so pulling the persisted
        // theme at load time keeps the bubble in sync with the main window.
        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        }
        if (window.electronAPI && window.electronAPI.loadData) {
            window.electronAPI.loadData('settings.json')
                .then(settings => { applyTheme(settings && settings.theme); })
                .catch(() => {});
        }

        function showToast(payload) {
            const data = payload || {};
            activeGeneration = Number(data.generation) || activeGeneration + 1;
            const generation = activeGeneration;
            toast.textContent = data.message || '';
            toast.className = data.isError ? 'error show' : 'show';
            clearTimeout(hideTimer);
            clearTimeout(fadeTimer);
            hideTimer = setTimeout(() => {
                if (generation !== activeGeneration) return;
                toast.classList.remove('show');
                fadeTimer = setTimeout(() => {
                    if (generation === activeGeneration) {
                        window.electronAPI.hideToast(generation);
                    }
                }, 200);
            }, data.duration || (data.isError ? 12000 : 2200));
        }

        window.electronAPI.onShowToast(showToast);
        window.electronAPI.getLastToast().then((payload) => {
            if (payload) showToast(payload);
        }).catch(() => {});
    </script>
</body>
</html>
